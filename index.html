<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Snake</h1>

    <section id="screen-start" class="screen panel">
      <p class="big-stat">Best <span id="start-best">0</span></p>
      <button type="button" id="start-btn" class="primary">Start</button>
    </section>

    <section id="screen-game" class="screen" hidden>
      <p class="hud">
        Level <span id="level">1</span> ·
        Food <span id="level-food">0</span>/<span id="level-goal">5</span> ·
        Score <span id="score" aria-live="polite">0</span>
      </p>
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="pad" aria-label="Direction buttons">
        <button type="button" class="up" data-dir="up" aria-label="Up">▲</button>
        <button type="button" class="left" data-dir="left" aria-label="Left">◀</button>
        <button type="button" class="right" data-dir="right" aria-label="Right">▶</button>
        <button type="button" class="down" data-dir="down" aria-label="Down">▼</button>
      </div>
      <p class="hint">Arrow keys or WASD to steer · Space or P to pause</p>
    </section>

    <section id="screen-over" class="screen panel" hidden aria-live="polite">
      <h2>Game over</h2>
      <p class="big-stat">Score <span id="over-score">0</span></p>
      <p class="stat">Best <span id="over-best">0</span></p>
      <p id="new-best" class="new-best" hidden>New best score!</p>
      <div class="actions">
        <button type="button" id="again-btn" class="primary">Play again</button>
        <button type="button" id="home-btn">Back to start</button>
      </div>
    </section>
  </main>
  <script src="levels/level-1.js"></script>
  <script src="levels/level-2.js"></script>
  <script src="levels/level-3.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
