<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Snake</h1>
    <p class="hud">Score <span id="score" aria-live="polite">0</span></p>
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <div class="pad" aria-label="Direction buttons">
      <button type="button" class="up" data-dir="up" aria-label="Up">▲</button>
      <button type="button" class="left" data-dir="left" aria-label="Left">◀</button>
      <button type="button" class="right" data-dir="right" aria-label="Right">▶</button>
      <button type="button" class="down" data-dir="down" aria-label="Down">▼</button>
    </div>
    <p class="hint">Arrow keys or WASD to steer · Space or P to pause</p>
  </main>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
